name: GraphQL Schemas & CLI Contract
on:
  pull_request:
    paths: ['cli/**', 'gql/**', '.github/workflows/graphql-contract.yml']
  push:
    paths: ['cli/**', 'gql/**', '.github/workflows/graphql-contract.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: |
            cli/go.sum
            gql/go.sum
      - name: Test GraphQL Schema Tool
        run: |
          go test -v ./...
          go run . -summary
        working-directory: gql
      - name: Test CLI
        run: go test -v ./...
        working-directory: cli
